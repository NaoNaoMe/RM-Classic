name: Release

on:
  push:
    tags:
      - 'v*'   # Trigger on tags like v2.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Restore
      - name: Restore
        run: dotnet restore rmApplication.sln

      # 4. Build
      - name: Build
        run: dotnet build rmApplication.sln -c Release --no-restore

      # 5. Publish self-contained single-file Release build
      - name: Publish
        run: dotnet publish rmApplication/rmApplication.csproj -c Release -p:PublishProfile=win-x64

      # 6. Package artifact
      - name: Package artifact
        shell: pwsh
        run: |
          $zip = "RM-Classic-${{ github.ref_name }}-win-x64.zip"
          $publishDir = "rmApplication/bin/Release/net10.0-windows7.0/publish/win-x64"
          $files = Get-ChildItem -Path $publishDir -File | Where-Object { $_.Extension -notin ".pdb", ".xml" }
          Compress-Archive -Path $files.FullName -DestinationPath $zip

      # 7. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          files: RM-Classic-*.zip
          generate_release_notes: true
